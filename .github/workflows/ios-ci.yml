name: iOS CI

# Proves a clean checkout compiles the iOS app (unsigned) on a cloud Mac —
# the collaborator's Xcode build should be a re-run of a green job, never a
# first attempt. macOS minutes bill at 10x, so triggers are deliberately narrow.

on:
  workflow_dispatch:
  push:
    branches: [master, ios-skeleton]
    paths:
      - 'mobile/**'
      - 'packages/**'
      - '.github/workflows/ios-ci.yml'

jobs:
  ios-build:
    # RN 0.86 / Expo SDK 57 needs Swift tools 6.2 → Xcode 26 (macos-15's default is too old)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Toolchain versions
        run: xcodebuild -version && swift --version

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install root deps and run theory-core tests
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Install mobile deps
        working-directory: mobile
        run: npm ci

      - name: Generate iOS project (prebuild + pod install)
        working-directory: mobile
        run: npx expo prebuild -p ios

      - name: Build (unsigned)
        working-directory: mobile
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | jq -r '.workspace.schemes[0]')
          echo "Building scheme '$SCHEME' from '$WORKSPACE'"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
